corpusId: unosim-tutor-quality-anchor
corpusVersion: 17
scenarios:
  - id: TQ-SEM-001
    sketch: evals/tutor-quality/semantic-fixtures/TQ-SEM-001-input-pullup.ino
    courseContent: free
    turns:
      - kind: dialog
        question: Welche logische Bedingung muss erfüllt sein, damit die LED eingeschaltet wird?
        answer: buttonPin, also an PIN2 muss GND anliegen!
        difficulty: 30
    expected:
      # Die Antwort ist korrekt (SSOT R-RAT-7). Band [4, 5] aus der Referenzbewertung
      # (LLM-Evaluator) vom 2026-10-06 (5 Samples, Rating 2/2/3 = schlecht, 4/4 = akzeptabel); nach dem
      # nächsten Lauf zu prüfen.
      answerRating: [4, 5]
    judge:
      facts:
        - pinMode(buttonPin, INPUT_PULLUP) aktiviert den internen Pull-up an buttonPin.
        - Mit Taster gegen GND liefert digitalRead(buttonPin) beim Drücken LOW.
        - Der Sketch schaltet ledPin (LED_BUILTIN) HIGH, wenn digitalRead(buttonPin) == LOW.
      criteria:
        - id: accepts-correct-answer
          text: Das Feedback erkennt die Kernaussage der Antwort als fachlich korrekt an, auch wenn es sie zusätzlich unnötig relativiert.
        - id: no-false-claim
          text: Feedback und Folgefrage enthalten keine fachlich falsche Aussage über den Sketch.
        - id: distinct-followup
          text: Die Folgefrage ist sketchbezogen und fordert einen neuen Denkschritt.
        - id: no-unneeded-qualification
          text: Das Feedback bestätigt die Kernaussage der Antwort, ohne sie unnötig als nur teilweise richtig einzuschränken, etwa mit „fast“, „nicht ganz“, „teilweise“ oder einer sinngleichen Relativierung.

