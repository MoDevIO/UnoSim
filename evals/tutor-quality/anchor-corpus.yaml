    turns:
      - kind: initial
        difficulty: 35
    expected:
      topicId: variables-and-serial

  - id: incorrect-answer-remediation
    sketch: evals/tutor-quality/fixtures/simple-variable.ino
    courseContent: free
    turns:
      - kind: dialog
        question: Welchen Wert gibt der Sketch über Serial aus?
        answer: Der Sketch gibt immer 99 aus.
        difficulty: 25
    expected:
      mustNotReveal:
        - counter = 3
    judge:
      facts:
        - counter wird mit dem Wert 3 initialisiert.
        - setup ruft Serial.println(counter) auf und gibt damit 3 aus.
        - loop erhöht counter, gibt ihn aber nicht aus.
        - Der Wert 99 kommt im Sketch nirgends vor.
      criteria:
        - id: no-solution-revealed
          text: Feedback und Folgefrage nennen den gesuchten Ausgabewert 3 nicht ausdrücklich und nicht so unmittelbar, dass er nur noch wiederholt werden muss.

  - id: partial-answer-follow-up
    sketch: evals/tutor-quality/fixtures/simple-variable.ino
    courseContent: free
    turns:
      - kind: dialog
        question: Wie hängt counter mit der Schleife zusammen?
        answer: counter ist eine Zahl.
        difficulty: 30
    judge:
      facts:
        - counter wird mit dem Wert 3 initialisiert.
        - loop erhöht counter in jedem Durchlauf um eins und wartet danach eine Sekunde.
        - Die Antwort, dass counter eine Zahl ist, stimmt, sagt aber nichts über den Zusammenhang mit der Schleife.
      criteria:
        - id: no-solution-revealed
          text: Feedback und Folgefrage nennen den gesuchten Zusammenhang (loop erhöht counter in jedem Durchlauf um eins) nicht ausdrücklich und nicht so unmittelbar, dass er nur noch wiederholt werden muss.

  - id: strong-answer-progression
    sketch: evals/tutor-quality/fixtures/serial-output.ino
    courseContent: free
    turns:
      - kind: dialog
        question: Welche Ausgabe erzeugt Serial.println im Sketch?
        answer: Die Funktion schreibt den aktuellen Wert von counter als Zeile in die serielle Ausgabe.
        difficulty: 40
    judge:
      facts:
        - Serial.println(counter) schreibt den aktuellen Wert von counter als eigene Zeile in die serielle Ausgabe.
        - Die Antwort beschreibt diesen Zusammenhang korrekt.
      criteria:
        - id: no-unneeded-qualification
          text: Das Feedback bestätigt die Kernaussage der Antwort, ohne sie unnötig als nur teilweise richtig einzuschränken, etwa mit „fast“, „nicht ganz“, „teilweise“ oder einer sinngleichen Relativierung.

