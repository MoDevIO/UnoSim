          text: Die Folgefrage baut auf dem Zusammenhang auf und verlangt einen neuen Denkschritt am selben Sketch.

  - id: strategy-deepen-transfer
    sketch: evals/tutor-quality/fixtures/simple-variable.ino
    courseContent: progression-deepen
    turns:
      - kind: initial
        difficulty: 45
      - kind: dialog
        question: Wie würdest du die Veränderung von counter an der seriellen Ausgabe überprüfen?
        answer: Ich würde in loop zusätzlich Serial.println(counter) ausgeben und prüfen, ob die Werte bei jedem Durchlauf um eins steigen.
        difficulty: 45
        continuationOf: 0
    expected:
      learningPhase: DEEPEN
      phaseAfter: EXPAND
      answerRating: [4, 5]
    judge:
      facts:
        - counter wird mit dem Wert 3 initialisiert.
        - setup gibt counter mit Serial.println(counter) einmalig aus.
        - loop erhöht counter in jedem Durchlauf um eins und wartet eine Sekunde, gibt counter aber nicht aus.
        - Eine zusätzliche Serial.println(counter)-Anweisung in loop würde die steigenden Werte sichtbar machen.
      criteria:
        - id: deepen-uses-transfer
          text: Das Feedback erkennt, dass die Antwort die Veränderung von counter durch eine zusätzliche Ausgabe in loop beobachtbar macht.
        - id: deepen-new-step
          text: Die Folgefrage verlangt einen neuen Denkschritt am Sketch und wiederholt die beantwortete Frage nicht.
        - id: deepen-no-false-output-claim
          text: Feedback und Folgefrage behaupten nicht, dass der aktuelle Sketch counter bereits in loop ausgibt.

  - id: strategy-deepen-correction
    sketch: evals/tutor-quality/fixtures/simple-variable.ino
    courseContent: progression-deepen
    turns:
      - kind: initial
        difficulty: 50
      - kind: dialog
        question: Wie würdest du die Veränderung von counter an der seriellen Ausgabe überprüfen?
        answer: delay(1000) erhöht counter automatisch, deshalb wird der Wert jede Sekunde größer.
        difficulty: 50
        continuationOf: 0
    expected:
      learningPhase: DEEPEN
      phaseAfter: DEEPEN
      answerRating: [1, 2]
    judge:
      facts:
        - delay(1000) wartet eine Sekunde, verändert aber keine Variable.
        - counter wird durch die Anweisung counter += 1 in loop erhöht, nicht durch delay.
        - setup gibt counter einmalig aus; loop gibt counter nicht aus.
      criteria:
        - id: deepen-corrects-misconception
          text: Das Feedback korrigiert klar die Annahme, dass delay counter erhöht.
        - id: deepen-explains-evidence
          text: Die Erklärung bindet die Korrektur an die tatsächlichen Anweisungen im Sketch.
        - id: deepen-supports-application
          text: Die Folgefrage fordert einen passenden nächsten Anwendungsschritt am selben Sketch.

  - id: strategy-expand-proposal
    sketch: evals/tutor-quality/fixtures/serial-output.ino
    courseContent: progression-expand
    turns:
      - kind: initial
        difficulty: 60
      - kind: dialog
        question: "Welche kleine, direkt am aktuellen Sketch prüfbare Erweiterung würdest du als Nächstes selbst umsetzen, um dieses Lernziel zu bearbeiten: „Eine weitere serielle Beobachtung am Sketch ableiten.“, und woran würdest du ihre Wirkung erkennen?"
        answer: Ich könnte counter nach einer Ausgabe erhöhen und die Werte im seriellen Monitor vergleichen.
        difficulty: 60
        continuationOf: 0
    expected:
      learningPhase: EXPAND
      phaseAfter: EXPAND
    judge:
      facts:
        - counter startet bei 3 und wird in setup sowie loop seriell ausgegeben.
        - loop erhöht counter im aktuellen Sketch noch nicht.
        - das Erweiterungsziel ist eine weitere serielle Beobachtung am Sketch abzuleiten.
      criteria:
        - id: expand-targets-observation
          text: Das Feedback bindet den Vorschlag an eine eigene, am Sketch prüfbare serielle Beobachtung.
        - id: expand-keeps-learner-idea
          text: Die Rückmeldung greift die Idee der lernenden Person auf, statt eine fremde Erweiterung einzusetzen.
        - id: expand-no-replacement-code
          text: Die Antwort liefert keinen vollständigen Ersatzcode.

  - id: strategy-expand-observation
    sketch: evals/tutor-quality/fixtures/serial-output.ino
    courseContent: progression-expand
    turns:
      - kind: initial
        difficulty: 65
      - kind: dialog
        question: "Welche kleine, direkt am aktuellen Sketch prüfbare Erweiterung würdest du als Nächstes selbst umsetzen, um dieses Lernziel zu bearbeiten: „Eine weitere serielle Beobachtung am Sketch ableiten.“, und woran würdest du ihre Wirkung erkennen?"
        answer: Wenn ich counter in loop erhöhe, sollten im seriellen Monitor nach und nach steigende Werte erscheinen.
        difficulty: 65
        continuationOf: 0
    expected:
      learningPhase: EXPAND
      phaseAfter: EXPAND
    judge:
      facts:
        - counter startet bei 3 und wird in loop wiederholt ausgegeben.
        - counter wird im aktuellen Sketch innerhalb von loop nicht erhöht.
        - eine Erweiterung soll eine zusätzliche serielle Beobachtung am Sketch ermöglichen.
      criteria:
        - id: expand-observable-result
          text: Das Feedback beschreibt ein konkretes serielles Ergebnis, an dem die vorgeschlagene Erweiterung geprüft werden kann.
        - id: expand-sketch-grounding
          text: Die Erklärung unterscheidet die vorgeschlagene Änderung korrekt vom bestehenden Sketch.
        - id: expand-scaffolding
          text: Die Folgefrage unterstützt weiteres eigenes Erproben, ohne den vollständigen Code vorzugeben.

  # Negative control for proposal answers: the proposed change is plausible to make, but the
  # expected observation is wrong for the changed sketch. A Tutor that accepts every proposal
  # as correct fails this case; the two EXPAND cases above only contain correct proposals.
  - id: strategy-expand-wrong-effect
    sketch: evals/tutor-quality/fixtures/serial-output.ino
    courseContent: progression-expand
    turns:
      - kind: initial
        difficulty: 60
      - kind: dialog
        question: "Welche kleine, direkt am aktuellen Sketch prüfbare Erweiterung würdest du als Nächstes selbst umsetzen, um dieses Lernziel zu bearbeiten: „Eine weitere serielle Beobachtung am Sketch ableiten.“, und woran würdest du ihre Wirkung erkennen?"
        answer: Wenn ich in loop delay(1000) durch delay(500) ersetze, sollten im seriellen Monitor nach und nach steigende Werte erscheinen.
        difficulty: 60
        continuationOf: 0
    expected:
      learningPhase: EXPAND
      phaseAfter: EXPAND
      answerRating: [1, 2]
    judge:
      facts:
        - counter startet bei 3 und wird in setup sowie in loop seriell ausgegeben.
        - Der Sketch verändert counter nirgends.
        - delay bestimmt nur die Wartezeit zwischen zwei Ausgaben und verändert keine Variable.
        - Mit delay(500) statt delay(1000) würde weiterhin der Wert 3 ausgegeben, nur doppelt so häufig.
      criteria:
        - id: expand-corrects-expected-effect
          text: Das Feedback stellt klar, dass die vorgeschlagene Änderung von delay allein keine steigenden Werte von counter erzeugt.
        - id: expand-explains-evidence
          text: Die Korrektur bindet sich an die tatsächliche Rolle von delay oder daran, dass counter im Sketch nicht verändert wird.
        - id: expand-no-replacement-code
          text: Die Antwort liefert keinen vollständigen Ersatzcode.

  # R-EXP-2 for an answered question the planner did not serve (for example a free or provider
  # fallback question): with an unused extension left, EXPAND continues with that extension instead
  # of ending in content-exhausted. The question is scripted on purpose (R-TURN-2), so the case
  # declares no learningPhase (R-TURN-3); an unexpected blocked reason fails it (R-BLK-2). The
  # follow-up is planned after the provider wrote its feedback, so the Judge checks that both fit.
  - id: expand-unplanned-answer
    sketch: evals/tutor-quality/fixtures/serial-output.ino
    courseContent: progression-expand
    turns:
      - kind: dialog
        question: Was bewirkt delay im Sketch?
        answer: Es wartet eine Sekunde, bevor counter erneut ausgegeben wird.
        difficulty: 60
    expected:
      topicId: variables-and-serial
    judge:
      facts:
        - counter startet bei 3 und wird in setup sowie in loop seriell ausgegeben.
        - delay(1000) in loop wartet eine Sekunde zwischen zwei Ausgaben.
        - Die Antwort der lernenden Person beschreibt die Wirkung von delay zutreffend.
        - Die Folgefrage lädt zu einer eigenen, am Sketch prüfbaren Erweiterung ein, die eine weitere serielle Beobachtung ableitet.
      criteria:
        - id: expand-followup-fits-feedback
          text: Feedback und Folgefrage passen zusammen; das Feedback kündigt keinen anderen nächsten Schritt an, als die Folgefrage stellt, und widerspricht ihr nicht.

  # Learning support over the production Tutor routes (Evaluation SSOT 15, R-SUP-E1..E4, LearningQuestions
  # R-SUP-8). The IT06.4 prediction question sets a = 200 while the Example starts with a = 37. The expected
  # values are computed by hand, independently of the Tutor model: i = 7, 1 << 7 = 128, 200 & 128 = 128,
  # (200 & 128) && 1 is true, so the first print is 1. The focus asks the concept question first; a different
  # question than the scripted one is reported as a binding problem (invalid sample), never answered.
  - id: TQ-SUP-IT064-ANSWER-1
    sketch: evals/tutor-quality/fixtures/it06-4-binaerzahl.ino
    courseContent: it06-4
    transport: http
    referenceProvenance: &it064-provenance "IT06.4, hand-computed (LearningQuestions R-SUP-8): a = 200, i = 7, 1 << 7 = 128, 200 & 128 = 128, (200 & 128) && 1 -> 1"
    turns:
      - kind: initial
      - kind: dialog
        question: &it064-concept "Welche Aufgabe hat `1 << i` in der Schleife?"
        answer: &it064-concept-answer Sie bildet eine Maske, in der nur Bit i gesetzt ist; a & (1 << i) prüft damit genau dieses Bit von a.
      - kind: dialog
        question: &it064-prediction "Was wird im ersten Durchlauf ausgegeben, wenn `a` den Wert 200 hat?"
        answer: "1"
    expected:
      answerRating: [4, 5]
      learnerInput: answer
    judge:
      facts: &it064-facts
        - Die Frage setzt a = 200; der Sketch startet mit a = 37, die Frage geht vor.
        - Im ersten Schleifendurchlauf ist i = 7, also 1 << 7 = 128.
        - 200 & 128 = 128, und (200 & 128) && 1 ist wahr; Serial.print gibt im ersten Durchlauf 1 aus.
        - Die ganze erste Zeile lautet 200 = 11001000.
      criteria:
        - id: accepts-correct-answer
          text: Das Feedback erkennt die Antwort 1 als richtig an und bezeichnet sie nicht als falsch.
        - id: no-false-claim
          text: Feedback und Folgefrage enthalten keine fachlich falsche Aussage über den Sketch oder die Rechnung.

