services:
  unosim-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: unosim-server:latest
    container_name: unosim-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - ARDUINO_CACHE_DIR=/app/arduino-cache
      - UNOSIM_SHARED_TEMP_DIR=/app/temp
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_SANDBOX_IMAGE=unosim-sandbox:latest
    ports:
      - "3000:3000"
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./server/arduino-cache:/app/arduino-cache
      - ./temp:/app/temp
      - ./storage:/app/storage
    networks:
      - unosim-net

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - unosim-net

  mcp-sonarqube:
    image: mcp/sonarqube:latest
    container_name: mcp-sonarqube
    restart: unless-stopped
    ports:
      - "9001:9000"
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONARQUBE_URL=http://sonarqube:9000
      - SONARQUBE_TOKEN=${SONARQUBE_TOKEN}
    volumes:
      - mcp_sonarqube_data:/opt/sonarqube/data
      - mcp_sonarqube_extensions:/opt/sonarqube/extensions
      - mcp_sonarqube_logs:/opt/sonarqube/logs
    networks:
      - unosim-net

networks:
  unosim-net:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  mcp_sonarqube_data:
  mcp_sonarqube_extensions:
  mcp_sonarqube_logs:
