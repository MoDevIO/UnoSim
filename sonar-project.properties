sonar.projectKey=unowebsim
sonar.projectName=UnoWebSim
sonar.projectVersion=1.0

# Trennung von App-Code und Test-Code
sonar.sources=client/src,server,shared
sonar.tests=tests

# Exclusions (Tests sind jetzt automatisch separiert, daher hier nur Build-Artefakte)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Coverage-Exclusions (Entry Points, Generated UI Wrappers - nicht sinnvoll unit-testbar)
sonar.coverage.exclusions=\
  client/src/main.tsx,\
  client/src/App.tsx,\
  client/src/pages/not-found.tsx,\
  server/index.ts,\
  server/vite.ts,\
  client/src/components/ui/alert-dialog.tsx,\
  client/src/components/ui/card.tsx,\
  client/src/components/ui/checkbox.tsx,\
  client/src/components/ui/dialog.tsx,\
  client/src/components/ui/input.tsx,\
  client/src/components/ui/toast.tsx,\
  client/src/components/ui/toaster.tsx,\
  client/src/components/ui/tooltip.tsx

# Coverage-Pfad (Bleibt gleich)
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Server-Konfiguration
sonar.host.url=http://localhost:9000

# WICHTIG: Die Zeile mit ${env:SONARQUBE_TOKEN} entfernen wir, 
# da der Scanner den Token automatisch aus der Umgebungsvariable SONAR_TOKEN zieht.