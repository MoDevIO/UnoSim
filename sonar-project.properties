sonar.projectKey=unowebsim
sonar.projectName=UnoWebSim
sonar.projectVersion=1.0

# Trennung von App-Code und Test-Code
sonar.sources=client/src,server,shared
sonar.tests=tests

# Exclusions (Tests sind jetzt automatisch separiert, daher hier nur Build-Artefakte)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Coverage-Pfad (Bleibt gleich)
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Server-Konfiguration
sonar.host.url=http://localhost:9000

# WICHTIG: Die Zeile mit ${env:SONARQUBE_TOKEN} entfernen wir, 
# da der Scanner den Token automatisch aus der Umgebungsvariable SONAR_TOKEN zieht.