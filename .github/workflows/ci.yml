name: CI (Quality Gate & Coverage)

on:
  # feature/browser-emulation integrates V2; its work-package PRs need the same gates as main.
  push:
    branches: [main, feature/browser-emulation]
  pull_request:
    branches: [main, feature/browser-emulation]

permissions:
  contents: read

# A new push to a PR cancels the superseded run; runs on main and feature/browser-emulation always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clean-room:
    name: Clean-room reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:node-version
      - run: npm run check
      - name: Dead-code gate (knip, reviewed baseline)
        run: ./run-tests.sh --knip-gate-only
      - name: Deterministic Tutor quality hard gate
        run: npm run test:tutor-quality
      - run: npm run test:unit
      - run: npm run build

  # JOB 1: Schnellläufer (Unit Tests, Linting, TypeCheck)
  build-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static Analysis & Unit Tests
        run: |
          npm run check
          npm run check:docs
          npm run lint
          npm run test:coverage

      - name: Copy Coverage Summary
        run: |
          # Sicherstellen, dass das Zielverzeichnis existiert
          mkdir -p coverage/lcov-report

          # Debugging: Zeige wo die Dateien wirklich liegen
          echo "Searching for coverage files..."
          find coverage -name "coverage-summary.json"

          # Kopieren mit Pfad-Prüfung
          if [ -f "coverage/coverage-summary.json" ]; then
            cp coverage/coverage-summary.json coverage/lcov-report/coverage-summary.json
          elif [ -f "server/coverage/coverage-summary.json" ]; then
            cp server/coverage/coverage-summary.json coverage/lcov-report/coverage-summary.json
          else
            echo "Error: coverage-summary.json not found!"
            exit 1
          fi

      - name: Deploy Coverage to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage/lcov-report
          publish_branch: gh-pages

      - name: Upload unit test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-metrics
          path: test-results/unit-coverage-metrics.json
          if-no-files-found: error
          retention-days: 14

  # JOB 2: Browser-End-to-End-Tests
  e2e-tests:
    name: Playwright E2E
    # No `needs: build-and-test`: the job builds the client itself, and waiting for the unit job put
    # about 220 s on the critical path of every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Cache E2E Assets (Arduino, Playwright, Sketches)
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/ms-playwright
            server/arduino-cache
            storage/binaries
          key: ${{ runner.os }}-e2e-turbo-arduino-cli-1.5.1-${{ hashFiles('scripts/arduino-avr-core-version', 'scripts/attinycore-version') }}-${{ hashFiles('package-lock.json', 'server/services/arduino-compiler.ts') }}
          restore-keys: |
            ${{ runner.os }}-e2e-turbo-

      - name: Install pinned Arduino CLI and AVR core
        run: |
          BINDIR=/usr/local/bin sh scripts/install-arduino-cli.sh
          arduino-cli version | grep -F "Version: 1.5.1 "
          sh scripts/install-arduino-avr-core.sh
          sh scripts/install-attinycore.sh

      # Without --with-deps: the runner image already has the system libraries Chromium needs, and
      # --with-deps runs apt-get update and installs CJK fonts, which took 12 s to 14 min depending on the mirror.
      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run E2E Tests
        env:
          ARDUINO_CACHE_DIR: ${{ github.workspace }}/server/arduino-cache
        run: npm run test:e2e

      - name: Upload Playwright report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-test-results
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 1

  # JOB 3: Echte Arduino-CLI-Integration, getrennt vom schnellen Unit-Gate
  toolchain-tests:
    name: Arduino Toolchain Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Arduino Toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
          key: ${{ runner.os }}-arduino-toolchain-cli-1.5.1-${{ hashFiles('scripts/arduino-avr-core-version', 'scripts/attinycore-version') }}-${{ hashFiles('package-lock.json') }}

      - name: Install pinned Arduino CLI and AVR core
        run: |
          BINDIR=/usr/local/bin sh scripts/install-arduino-cli.sh
          arduino-cli version | grep -F "Version: 1.5.1 "
          sh scripts/install-arduino-avr-core.sh
          sh scripts/install-attinycore.sh

      - name: Run toolchain integration tests
        env:
          ARDUINO_CACHE_DIR: /tmp/arduino-toolchain-cache
        run: npm run test:integration

      - name: Upload toolchain test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-test-metrics
          path: test-results/integration-toolchain-metrics.json
          if-no-files-found: error
          retention-days: 14

  # JOB 4: Sandbox-Integration mit eigenem Docker-Budget
  docker-tests:
    name: Docker Sandbox Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Sandbox Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.sandbox
          load: true
          tags: unosim-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Compile Sandbox Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.compile-sandbox
          load: true
          tags: unosim-compile-sandbox:latest
          cache-from: type=gha,scope=compile-sandbox
          cache-to: type=gha,scope=compile-sandbox,mode=max

      - name: Run Docker sandbox tests
        run: npm run test:docker

      - name: Upload Docker test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-metrics
          path: test-results/integration-docker-metrics.json
          if-no-files-found: error
          retention-days: 14

  # JOB 5: Produktionspfad hinter dem Gateway (echtes Production-Image, Gateway-Modus)
  deployment-tests:
    name: Production Gateway Deployment
    runs-on: ubuntu-latest
    # A hung Docker or Compose call must fail the gate, not hold the runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Sandbox Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.sandbox
          load: true
          tags: unosim-sandbox:deployment-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Compile Sandbox Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.compile-sandbox
          load: true
          tags: unosim-compile-sandbox:deployment-ci
          cache-from: type=gha,scope=compile-sandbox
          cache-to: type=gha,scope=compile-sandbox,mode=max

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: unosim-server:deployment-ci
          cache-from: type=gha,scope=unosim-production
          cache-to: type=gha,scope=unosim-production,mode=max

      # The production image only starts the sandboxes (plan P2.4): no compiler in it,
      # the pinned toolchain lives in the compile sandbox image.
      - name: Verify the toolchain placement
        run: |
          docker run --rm --entrypoint sh unosim-server:deployment-ci -c '! command -v arduino-cli && ! command -v g++'
          docker run --rm --entrypoint arduino-cli unosim-compile-sandbox:deployment-ci version | grep -F "Version: 1.5.1 "
          docker run --rm --entrypoint sh unosim-compile-sandbox:deployment-ci -c 'sh /usr/local/bin/check-arduino-avr-core-version.sh'
          docker run --rm --entrypoint sh unosim-compile-sandbox:deployment-ci -c 'sh /usr/local/bin/check-attinycore-version.sh'

      - name: Containerised gateway deployment
        timeout-minutes: 15
        env:
          DEPLOYMENT_PREBUILT_SERVER_IMAGE: unosim-server:deployment-ci
          DEPLOYMENT_PREBUILT_SANDBOX_IMAGE: unosim-sandbox:deployment-ci
          DEPLOYMENT_PREBUILT_COMPILE_SANDBOX_IMAGE: unosim-compile-sandbox:deployment-ci
        run: npm run test:deployment

      - name: Ubuntu/VBox installer topology (host gateway, production compose)
        timeout-minutes: 15
        env:
          DEPLOYMENT_PREBUILT_SERVER_IMAGE: unosim-server:deployment-ci
          DEPLOYMENT_PREBUILT_SANDBOX_IMAGE: unosim-sandbox:deployment-ci
          DEPLOYMENT_PREBUILT_COMPILE_SANDBOX_IMAGE: unosim-compile-sandbox:deployment-ci
        run: npm run test:deployment:installer

      - name: Diagnostics and leftover cleanup
        if: always()
        run: |
          docker ps -a --format '{{.Names}}\t{{.Status}}' | grep -E 'unosim|deployment|installer' || true
          for container in $(docker ps -aq --filter 'name=unosim-'); do docker rm -f "$container" >/dev/null || true; done
          for project in $(docker compose ls -aq | grep -E '^unosim-(deployment|installer)-test-' || true); do
            docker compose -p "$project" down --remove-orphans -v || true
          done
