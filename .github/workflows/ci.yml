name: CI (Quality Gate & Coverage)

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # JOB 1: Schnellläufer (Unit Tests, Linting, TypeCheck)
  build-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static Analysis & Unit Tests
        run: |
          npm run check
          npm run lint
          npm run test:coverage

      - name: Deploy Coverage to GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./coverage/lcov-report
          publish_branch: gh-pages

  # JOB 2: Schwergewicht (Docker & E2E) - LÄUFT JETZT PARALLEL ZU JOB 1
  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Turbo-Hebel 1: Docker Buildx für Layer-Caching vorbereiten
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Turbo-Hebel 2: Kombinierter Cache für Tooling, Browser und Sketche
      - name: Cache E2E Assets (Arduino, Playwright, Sketches)
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/arduino-cli
            ~/.arduino15
            ~/.cache/ms-playwright
            server/arduino-cache
            storage/binaries
          key: ${{ runner.os }}-e2e-turbo-${{ hashFiles('package-lock.json', 'server/services/arduino-compiler.ts') }}
          restore-keys: |
            ${{ runner.os }}-e2e-turbo-

      - name: Install Arduino CLI & Core
        run: |
          if ! command -v arduino-cli &> /dev/null; then
            curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          fi
          arduino-cli core list | grep "arduino:avr" || (arduino-cli core update-index && arduino-cli core install arduino:avr)

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Turbo-Hebel 3: Docker Build mit nativem GitHub Actions Cache (type=gha)
      - name: Build Sandbox Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: unowebsim-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run E2E Tests
        env:
          ARDUINO_CACHE_DIR: ${{ github.workspace }}/server/arduino-cache
        run: npx playwright test --update-snapshots=missing --workers=2

      - name: Commit new Linux visual baselines
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add 'e2e/visual-full-context.spec.ts-snapshots/*-linux.png'
          git diff --staged --quiet || (git commit -m "chore(e2e): update linux visual baselines [skip ci]" && git push)

      - name: Upload E2E Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7