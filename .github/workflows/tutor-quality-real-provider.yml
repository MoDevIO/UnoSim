name: Tutor Quality Real-Provider Evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: Fixed provider model ID (auto is rejected)
        required: true
        type: string
      samples:
        description: Samples per anchor scenario
        required: true
        default: "1"
        type: string
      max_calls:
        description: Maximum provider calls, including model-list calls
        required: true
        default: "30"
        type: string
      judge_model:
        description: Fixed Judge model ID (leave empty for execution only)
        required: false
        type: string
      case:
        description: Optional anchor case ID
        required: false
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    name: Tutor and Judge observation run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run optional real-provider evaluation
        env:
          UNOSIM_TUTOR_EVAL_CREDENTIAL: ${{ secrets.UNOSIM_TUTOR_EVAL_CREDENTIAL }}
          UNOSIM_TUTOR_JUDGE_CREDENTIAL: ${{ secrets.UNOSIM_TUTOR_JUDGE_CREDENTIAL }}
          TUTOR_MODEL: ${{ inputs.model }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          CASE_ID: ${{ inputs.case }}
          SAMPLES: ${{ inputs.samples }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: |
          args=(
            --model "$TUTOR_MODEL"
            --samples "$SAMPLES"
            --max-calls "$MAX_CALLS"
            --credential-env UNOSIM_TUTOR_EVAL_CREDENTIAL
            --output-dir .tutor-quality-output
          )
          if [ -n "$JUDGE_MODEL" ]; then
            args+=(--judge-model "$JUDGE_MODEL" --judge-credential-env UNOSIM_TUTOR_JUDGE_CREDENTIAL)
          fi
          if [ -n "$CASE_ID" ]; then
            args+=(--case "$CASE_ID")
          fi
          npm run eval:tutor-quality:real -- "${args[@]}"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutor-quality-run-${{ github.run_id }}
          path: .tutor-quality-output/
          if-no-files-found: error
          retention-days: 14
