name: Tutor Quality Real-Provider Evaluation

# L3 of the Tutor Quality evaluation (ssot/ssot_function_definition_TutorQualityEvaluation.md, Appendix B).
# Manual dispatch only: L3 runs before relevant Tutor changes, normally locally. There is no
# schedule; without provider secrets a periodic run would only report a green not-run.
# The job result follows the CLI exit code (R-VER-8): pass/warn and not-run succeed, fail and
# inconclusive fail the job. No pull_request trigger (R-PYR-2).

on:
  workflow_dispatch:
    inputs:
      model:
        description: Fixed provider model ID (auto is rejected)
        required: true
        type: string
      samples:
        description: Samples per anchor scenario
        required: true
        default: "1"
        type: string
      max_calls:
        description: Maximum provider calls, including model-list calls (compute per R-BUD-2)
        required: true
        default: "30"
        type: string
      judge_model:
        description: Fixed Judge model ID (leave empty for execution only)
        required: false
        type: string
      case:
        description: Optional anchor case ID
        required: false
        type: string

permissions:
  contents: read

# One real-provider evaluation at a time; a queued run waits instead of cancelling a running one.
concurrency:
  group: tutor-quality-real-provider
  cancel-in-progress: false

jobs:
  evaluate:
    name: Tutor and Judge evaluation run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run real-provider evaluation
        env:
          UNOSIM_TUTOR_EVAL_CREDENTIAL: ${{ secrets.UNOSIM_TUTOR_EVAL_CREDENTIAL }}
          UNOSIM_TUTOR_JUDGE_CREDENTIAL: ${{ secrets.UNOSIM_TUTOR_JUDGE_CREDENTIAL }}
          TUTOR_MODEL: ${{ inputs.model }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          CASE_ID: ${{ inputs.case }}
          SAMPLES: ${{ inputs.samples }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: |
          args=(
            --model "$TUTOR_MODEL"
            --samples "$SAMPLES"
            --max-calls "$MAX_CALLS"
            --credential-env UNOSIM_TUTOR_EVAL_CREDENTIAL
            --output-dir .tutor-quality-output
          )
          if [ -n "$JUDGE_MODEL" ]; then
            args+=(--judge-model "$JUDGE_MODEL" --judge-credential-env UNOSIM_TUTOR_JUDGE_CREDENTIAL)
          fi
          if [ -n "$CASE_ID" ]; then
            args+=(--case "$CASE_ID")
          fi
          npm run eval:tutor-quality:real -- "${args[@]}"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutor-quality-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tutor-quality-output/
          if-no-files-found: error
          retention-days: 28
